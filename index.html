<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
        }
        
        .container {
            border: solid 2px rgb(10, 2, 26);
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <form action="">
            <table>
                <h1>Employee Details</h1>
                <tr>
                    <td><label for="employee_id">Employee ID</label></td>
                    <td><input type="text" id="employee_id"></td>
                </tr>
                <tr>
                    <td><label for="nic">NIC</label></td>
                    <td><input type="text" id="nic"></td>
                </tr>
                <tr>
                    <td><label for="title">Title</label></td>
                    <td><input type="text" id="title"></td>
                </tr>
                <tr>
                    <td><label for="first_name">First Name</label></td>
                    <td><input type="text" id="first_name"></td>
                </tr>
                <tr>
                    <td><label for="last_name">Last Name</label></td>
                    <td><input type="text" id="last_name"></td>
                </tr>
                <tr>
                    <td><label for="gender">Gender</label></td>
                    <td><input type="text" id="gender"></td>
                </tr>
                <tr>
                    <td><label for="dob">Date Of Birth</label></td>
                    <td><input type="text" id="dob"></td>
                </tr>
                <tr>
                    <td><label for="age">Age</label></td>
                    <td><input type="text" id="age"></td>
                </tr>
                <tr>
                    <td><label for="salary">Salary</label></td>
                    <td><input type="text" id="salary"></td>
                </tr>
            </table>
            <br>
        </form>
        <button type="submit">Submit</button>

    </div>
    <script>
        document.getElementById('title').onchange = function() {
            var Title = document.getElementById('title').value;
            if (Title == 'Mr') {
                document.getElementById('gender').value = 'male';
            } else if (Title == 'Ms' || Title == 'Mrs') {
                document.getElementById('gender').value = 'female';
            } else {
                document.getElementById('gender').value = 'invalid title';
            }
        }
    </script>
</body>

</html>
